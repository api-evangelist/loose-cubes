name: Loose Cubes
description: 'Loosecubes, Inc. was a membership-based marketplace often described as the "Airbnb for
  shared office space" — it connected people looking for a place to work with companies that had vacant
  desks and coworking space. Founded in 2010 in Brooklyn, New York by Campbell McKellar (Walmsley) and
  Anna Thomas, it raised roughly $9M total, including a $7.8M Series A led by New Enterprise Associates
  with Revolution Ventures and Battery Ventures participating. The company shut down and permanently
  closed in late 2012. This profile was surfaced as a Battery Ventures portfolio lead; enrichment found
  no live API surface — the business is defunct and the loosecubes.com domain is now held by an unrelated
  owner.'
